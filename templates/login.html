{% extends "auth_base.html" %}

{% block title %}Sign In | NEEPCO Data Portal{% endblock %}

{% block content %}
<div class="mb-3 text-center">
    <h3 class="h5 fw-bold text-dark">Portal Authentication</h3>
    <p class="text-muted small">Sign in with your authorized credentials</p>
</div>

<!-- Quick Demo Credentials Hint Box -->
<div class="alert alert-info py-2 px-3 small d-flex align-items-center justify-content-between mb-4 border-info-subtle">
    <div>
        <strong class="d-block text-dark"><i class="bi bi-key-fill text-primary me-1"></i> Demo Access:</strong>
        <span class="text-muted">Username: <code>admin</code> | Password: <code>admin123</code></span>
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" style="font-size: 0.75rem;" onclick="fillDemo()">
        Auto-Fill
    </button>
</div>

<form method="POST" action="{{ url_for('login') }}">
    <div class="mb-3">
        <label for="login_id" class="form-label small fw-semibold text-secondary">Username or Email</label>
        <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="login_id" name="login_id" value="{{ login_id or '' }}" placeholder="Enter username or email" required autofocus>
        </div>
    </div>

    <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label small fw-semibold text-secondary mb-0">Password</label>
        </div>
        <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
            <label class="form-check-label small text-muted" for="remember_me">
                Remember me
            </label>
        </div>
    </div>

    <button type="submit" class="btn btn-neepco w-100 py-2 justify-content-center shadow-sm">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Portal
    </button>
</form>

<div class="text-center mt-4 pt-2 border-top">
    <p class="small text-muted mb-0">
        New personnel? <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
    </p>
</div>

<script>
function fillDemo() {
    document.getElementById('login_id').value = 'admin';
    document.getElementById('password').value = 'admin123';
}
</script>
{% endblock %}
